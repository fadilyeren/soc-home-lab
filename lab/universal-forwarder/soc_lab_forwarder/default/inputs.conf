# Home Lab - Windows VM'den toplanan loglar
#
# Her [WinEventLog://...] bloğu bir Windows olay günlüğünü (kanalını) okur.
# index         : Splunk'ta olayların yazılacağı yer. Bu index'ler host'taki Splunk'ta
#                 önceden oluşturulmalı: wineventlog ve sysmon.
# renderXml     : true = olaylar XML olarak gönderilir (sourcetype: XmlWinEventLog).
#                 Splunk Add-on for Microsoft Windows ve Splunk Add-on for Sysmon bu biçimi tanır.
# disabled = 0  : bu girdi açık.

# Oturum açma, hesap değişiklikleri, yetki kullanımı (ör. 4624, 4625, 4720)
[WinEventLog://Security]
disabled = 0
index = wineventlog
renderXml = true
evt_resolve_ad_obj = 0

# Servis kurulumu ve sistem olayları (ör. 7045 yeni servis)
[WinEventLog://System]
disabled = 0
index = wineventlog
renderXml = true

[WinEventLog://Application]
disabled = 0
index = wineventlog
renderXml = true

# PowerShell çalışmaları (ör. 4104 script block; ayrıca açılması gerekir)
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog
renderXml = true

# Microsoft Defender tespitleri
[WinEventLog://Microsoft-Windows-Windows Defender/Operational]
disabled = 0
index = wineventlog
renderXml = true

# Sysmon: süreç oluşturma (1), ağ bağlantısı (3), dosya oluşturma (11) vb.
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = true

# --- Kullanılmayan Windows girdi türleri ---
# Forwarder bu girdi türlerinin yardımcı programlarını (splunk-admon.exe, splunk-regmon.exe,
# splunk-netmon.exe, splunk-MonitorNoHandle.exe, splunk-powershell.exe) tanımlı bir girdi
# olmasa bile dakikada bir başlatıyordu; Sysmon'da saatte ~360 gereksiz süreç olayı (olay 1).
# Bu lab'da hiçbirini kullanmıyoruz. disabled = 1 kapatır; interval = -1 periyodik çalışmayı durdurur.
# Kaynak: Splunk Community, "Why is the Universal forwarder executing regmon, powershells and ..."
# (Splunk 7.2 dönemi). Forwarder 10.6.1.1'de doğrulandı (2026-11-07): yardımcılar artık başlatılmıyor.

# Active Directory izleme
[admon]
disabled = 1
interval = -1

# Kayıt defteri izleme
[WinRegMon]
disabled = 1
interval = -1

# Ağ izleme
[WinNetMon]
disabled = 1
interval = -1

# Kilitli dosya izleme
[MonitorNoHandle]
disabled = 1
interval = -1

# PowerShell betik girdisi (PowerShell günlüğünü OKUMAK bundan bağımsızdır; o yukarıdaki WinEventLog girdisi)
[powershell]
disabled = 1
interval = -1

[powershell2]
disabled = 1
interval = -1
